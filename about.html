    <style>
        * {

            padding: 0;

        }

        .nav {
            margin-bottom: 20px;
            display: flex;

        }

            text-decoration: none;
            color: #667eea;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 20px;
