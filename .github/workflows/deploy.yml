# ============================================================
# DevOps Lab 1 — CI/CD Pipeline với GitHub Actions
# Có tích hợp Google Lighthouse CI Audit
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Kiểm tra HTML cơ bản
      - name: Validate HTML
        run: |
          echo "Checking index.html exists..."
          if [ -f "index.html" ]; then
            echo "index.html found!"
            echo "File size: $(wc -c < index.html) bytes"
          else
            echo "index.html NOT found!"
            exit 1
          fi

      # Step 3: CHẠY GOOGLE LIGHTHOUSE CI ĐỂ CHẤM ĐIỂM WEB (MỚI THÊM)
      - name: Audit with Google Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./  # Yêu cầu Lighthouse quét các file HTML ở thư mục hiện tại
          temporaryPublicStorage: true # Tạo một đường link online để xem báo cáo
          runs: 1 # Chạy quét 1 lần để tiết kiệm thời gian

      # Step 4: Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          commit_message: "Auto-deploy from CI pipeline with Lighthouse Audit"